<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html, body, #term {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0E0F10;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <script src="xterm.min.js"></script>
    <script>
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: 'monospace',
        theme: {
          background: '#0E0F10',
          foreground: '#F5F6F7',
          cursor: '#7AB0FF'
        }
      });
      term.open(document.getElementById('term'));
      term.onData(function (data) {
        if (window.AndroidBridge && window.AndroidBridge.write) {
          window.AndroidBridge.write(data);
        }
      });
      window.writeOutput = function (b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        term.write(bytes);
      };
      window.setSize = function (cols, rows) {
        try {
          term.resize(cols, rows);
        } catch (e) {}
      };
    </script>
  </body>
</html>
