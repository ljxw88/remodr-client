name: Build and Release Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize publication, including manual runs and reruns. Do not cancel a run
# halfway through replacing release assets; stale queued builds fail freshness checks.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    # NB: the EAS local build alone takes ~40min (heavy native modules:
    # Skia, Reanimated), plus ~15min of SDK/npm setup. A 60min cap kills the
    # job mid-release-publish with "The operation was canceled".
    timeout-minutes: 180
    permissions:
      contents: write

    env:
      EAS_SKIP_AUTO_FINGERPRINT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source before building
        run: node scripts/check-release-source.cjs

      - name: Free disk space on runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo docker system prune --all --volumes -f || true
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NB: do NOT use the action's default packages (`tools platform-tools`):
          # the legacy `tools` package was removed from Google's SDK repository,
          # so `sdkmanager tools` fails with "Failed to find package 'tools'".
          # Install only packages that exist and that this build needs
          # (Expo 57 defaults: compileSdk/targetSdk 36).
          # NOTE: no quotes around the semicolon specs — the action splits this
          # string on whitespace and passes each token straight to sdkmanager
          # (no shell), so quotes would become part of the package name.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Increase inotify watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      - name: Install dependencies
        run: npm ci

      - name: Resolve App Version
        id: app_version
        run: |
          RAW_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            node scripts/sync-version.cjs --check --tag "$TAG"
            CLEAN_VERSION="${TAG#v}"
            APK_BASENAME="remodr-${TAG}"
            IS_PRERELEASE=false
            RELEASE_TITLE="Remodr ${TAG}"
          else
            TAG="preview"
            CLEAN_VERSION="${RAW_VERSION}"
            APK_BASENAME="remodr-${RAW_VERSION}-preview-${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE=true
            RELEASE_TITLE="Remodr v${RAW_VERSION} Preview (${GITHUB_RUN_NUMBER})"
          fi

          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_basename=${APK_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APK_BASENAME: ${{ steps.app_version.outputs.apk_basename }}
        run: |
          mkdir -p build
          TARGET_APK="build/${APK_BASENAME}.apk"
          npx --yes eas-cli@23.2.0 build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$TARGET_APK"
          # Create a stable unversioned copy for permanent download links
          cp "$TARGET_APK" build/remodr-preview.apk

      - name: Verify the built APK version before uploading
        env:
          APK_BASENAME: ${{ steps.app_version.outputs.apk_basename }}
        run: node scripts/sync-version.cjs --check --apk "build/${APK_BASENAME}.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_version.outputs.apk_basename }}
          path: build/${{ steps.app_version.outputs.apk_basename }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.app_version.outputs.tag }}
          TITLE: ${{ steps.app_version.outputs.title }}
          IS_PRERELEASE: ${{ steps.app_version.outputs.is_prerelease }}
          APK_BASENAME: ${{ steps.app_version.outputs.apk_basename }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          # Recheck after the long build, immediately before any release writes.
          node scripts/check-release-source.cjs

          PRIMARY_APK="build/${APK_BASENAME}.apk"
          STABLE_APK="build/remodr-preview.apk"

          if [ "$IS_PRERELEASE" = "true" ]; then
            RECENT_CHANGES=$(git log -n 15 --no-merges --pretty=format:"* %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" 2>/dev/null || echo "* Automated preview update")

            NOTES=$(printf "%s\n" \
              "### Remodr Preview Build (Alpha)" \
              "- **Version:** \`${APP_VERSION}\`" \
              "- **Build:** \`#${GITHUB_RUN_NUMBER}\`" \
              "- **Commit:** [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})" \
              "- **Built at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              "" \
              "#### 📦 Download APK:" \
              "- [\`${APK_BASENAME}.apk\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/preview/${APK_BASENAME}.apk)" \
              "- [\`remodr-preview.apk\` (latest)](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/preview/remodr-preview.apk)" \
              "" \
              "---" \
              "" \
              "### 📝 What's Changed" \
              "${RECENT_CHANGES}")

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Updating existing release $TAG..."
              gh release upload "$TAG" "$PRIMARY_APK" "$STABLE_APK" --clobber
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            else
              echo "Creating new release $TAG..."
              gh release create "$TAG" "$PRIMARY_APK" "$STABLE_APK" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --prerelease \
                --notes "$NOTES"
            fi
          else
            # Official Tagged Release (e.g., v0.1.0)
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Updating existing release $TAG..."
              gh release upload "$TAG" "$PRIMARY_APK" --clobber
            else
              echo "Creating official release $TAG..."
              gh release create "$TAG" "$PRIMARY_APK" \
                --verify-tag \
                --title "$TITLE" \
                --generate-notes
            fi
          fi
