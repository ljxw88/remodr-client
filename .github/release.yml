# Configuration for GitHub's automated release notes generator
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: 🚀 Features & Enhancements
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: 🎨 UI / UX
      labels:
        - ui
        - ux
    - title: 🧰 Maintenance & Refactoring
      labels:
        - chore
        - refactor
        - dependencies
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
