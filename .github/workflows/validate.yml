name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release-tag:
        description: Optional exact v-prefixed tag to check against package.json and app.json
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Check app and release versions without modifying them
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            npm run version:check -- --tag "$RELEASE_TAG"
          else
            npm run version:check
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: JavaScript tests
        run: npm test -- --runInBand

      - name: Release script regression tests
        run: npm test -- --runInBand --testMatch '<rootDir>/scripts/*.test.cjs'

      - name: Python bridge tests
        run: python3 -m unittest discover -s modules/remote-core/bridge -p 'test_*.py'
