plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.remoteworkspace.remotecore'
version = '0.1.0'

def bridgeAssets = layout.buildDirectory.dir('generated/bridgeAssets')
def bridgeBundle = bridgeAssets.map { it.file('herdr_mobile_bridge.pyz') }
def bundleHerdrBridge = tasks.register('bundleHerdrBridge', Exec) {
  inputs.files(fileTree('../bridge/remodr_bridge') {
    include '**/*.py'
    exclude '**/__pycache__/**', '**/tests/**', '**/test_*.py', '**/*_test.py'
  })
  inputs.files('../bridge/archive_main.py', '../bridge/build_bundle.py')
  outputs.file(bridgeBundle)
  commandLine(
    providers.gradleProperty('herdrBridgePython').getOrElse('python3'),
    file('../bridge/build_bundle.py').absolutePath,
    '--output', bridgeBundle.get().asFile.absolutePath,
  )
}

tasks.configureEach {
  if (name == 'preBuild' || (name.startsWith('merge') && name.endsWith('Assets'))) {
    dependsOn(bundleHerdrBridge)
  }
}

android {
  namespace "com.remoteworkspace.remotecore"
  sourceSets {
    main {
      assets.srcDir bridgeAssets
      assets.include 'herdr_mobile_bridge.pyz'
    }
  }
  androidResources {
    ignoreAssetsPatterns.addAll(['test_*', '__pycache__', '*.pyc', 'README.md'])
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.hierynomus:sshj:0.39.0'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
  implementation 'net.i2p.crypto:eddsa:0.3.0'
  implementation 'androidx.security:security-crypto:1.0.0'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
}
